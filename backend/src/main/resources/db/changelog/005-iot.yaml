databaseChangeLog:
  - changeSet:
      id: 005-001-machine-reported-state
      author: gruahub
      changes:
        - createTable:
            tableName: machine_reported_state
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: machine_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: online
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: last_heartbeat_at
                  type: timestamptz
              - column:
                  name: last_sequence
                  type: bigint
                  defaultValueNumeric: 0
              - column:
                  name: door_open
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: motor_fault
                  type: boolean
                  defaultValueBoolean: false
              - column:
                  name: credits_available
                  type: int
                  defaultValueNumeric: 0
              - column:
                  name: firmware_version
                  type: varchar(50)
              - column:
                  name: extra
                  type: jsonb
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: machine_reported_state
            constraintName: uq_machine_reported_state_machine
            columnNames: machine_id
        - addForeignKeyConstraint:
            baseTableName: machine_reported_state
            baseColumnNames: machine_id
            constraintName: fk_machine_reported_state_machine
            referencedTableName: machine
            referencedColumnNames: id

  - changeSet:
      id: 005-002-machine-desired-state
      author: gruahub
      changes:
        - createTable:
            tableName: machine_desired_state
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: machine_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: play_price_cents
                  type: bigint
              - column:
                  name: bonus_plays
                  type: int
              - column:
                  name: enabled
                  type: boolean
                  defaultValueBoolean: true
              - column:
                  name: extra
                  type: jsonb
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: machine_desired_state
            constraintName: uq_machine_desired_state_machine
            columnNames: machine_id
        - addForeignKeyConstraint:
            baseTableName: machine_desired_state
            baseColumnNames: machine_id
            constraintName: fk_machine_desired_state_machine
            referencedTableName: machine
            referencedColumnNames: id

  - changeSet:
      id: 005-003-device-message-inbox
      author: gruahub
      changes:
        - createTable:
            tableName: device_message_inbox
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_id
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: machine_id
                  type: uuid
              - column:
                  name: message_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: schema_version
                  type: int
                  defaultValueNumeric: 1
              - column:
                  name: sequence
                  type: bigint
              - column:
                  name: payload
                  type: jsonb
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: RECEIVED
              - column:
                  name: received_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamptz
              - column:
                  name: error_message
                  type: text
        - addUniqueConstraint:
            tableName: device_message_inbox
            constraintName: uq_device_message_inbox_key
            columnNames: message_id, tenant_id
        - createIndex:
            tableName: device_message_inbox
            indexName: idx_device_message_inbox_status
            columns:
              - column:
                  name: status
              - column:
                  name: received_at

  - changeSet:
      id: 005-004-device-command
      author: gruahub
      changes:
        - createTable:
            tableName: device_command
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: command_id
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: machine_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: command_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: jsonb
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: PENDING
                  constraints:
                    nullable: false
              - column:
                  name: correlation_id
                  type: varchar(100)
              - column:
                  name: requested_by_user_id
                  type: uuid
              - column:
                  name: expires_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: published_at
                  type: timestamptz
              - column:
                  name: acked_at
                  type: timestamptz
              - column:
                  name: executed_at
                  type: timestamptz
              - column:
                  name: error_message
                  type: text
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
        - addUniqueConstraint:
            tableName: device_command
            constraintName: uq_device_command_id_tenant
            columnNames: command_id, tenant_id
        - createIndex:
            tableName: device_command
            indexName: idx_device_command_machine_status
            columns:
              - column:
                  name: machine_id
              - column:
                  name: status

  - changeSet:
      id: 005-005-telemetry-event
      author: gruahub
      changes:
        - createTable:
            tableName: telemetry_event
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: machine_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: occurred_at
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: payload
                  type: jsonb
              - column:
                  name: received_at
                  type: timestamptz
                  defaultValueComputed: NOW()
        - createIndex:
            tableName: telemetry_event
            indexName: idx_telemetry_machine_time
            columns:
              - column:
                  name: machine_id
              - column:
                  name: occurred_at
