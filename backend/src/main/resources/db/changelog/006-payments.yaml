databaseChangeLog:
  - changeSet:
      id: 006-001-payment-transaction
      author: gruahub
      changes:
        - createTable:
            tableName: payment_transaction
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: machine_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: operating_point_id
                  type: uuid
              - column:
                  name: provider_transaction_id
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: varchar(50)
                  defaultValue: SANDBOX
                  constraints:
                    nullable: false
              - column:
                  name: amount_cents
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: currency
                  type: varchar(3)
                  defaultValue: BRL
                  constraints:
                    nullable: false
              - column:
                  name: payment_method
                  type: varchar(30)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: CREATED
                  constraints:
                    nullable: false
              - column:
                  name: status_history
                  type: jsonb
                  defaultValue: '[]'
              - column:
                  name: metadata
                  type: jsonb
                  defaultValue: '{}'
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: confirmed_at
                  type: timestamptz
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
        - addForeignKeyConstraint:
            baseTableName: payment_transaction
            baseColumnNames: tenant_id
            constraintName: fk_payment_tenant
            referencedTableName: tenant
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: payment_transaction
            constraintName: uq_payment_provider_tx_tenant
            columnNames: provider_transaction_id, provider, tenant_id
        - createIndex:
            tableName: payment_transaction
            indexName: idx_payment_machine_status
            columns:
              - column:
                  name: machine_id
              - column:
                  name: status

  - changeSet:
      id: 006-002-payment-event-inbox
      author: gruahub
      changes:
        - createTable:
            tableName: payment_event_inbox
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: event_key
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: provider
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: event_type
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: payload_hash
                  type: varchar(64)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: RECEIVED
              - column:
                  name: received_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: processed_at
                  type: timestamptz
              - column:
                  name: error_message
                  type: text
        - addUniqueConstraint:
            tableName: payment_event_inbox
            constraintName: uq_payment_event_key_tenant
            columnNames: event_key, tenant_id
