; PlatformIO — Adaptador Fino GruaHub (Pulse Adapter v0)
; Build: pio run  |  Docker: ver README

[platformio]
default_envs = esp32dev
src_dir = src

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
	bblanchon/ArduinoJson@^7.2.1
	knolleary/PubSubClient@^2.8
build_flags =
	-DFIRMWARE_VERSION=\"0.1.0-pulse\"
	-DCREDIT_OUT_GPIO=26
	-DPLAY_IN_GPIO=-1
	-DMQTT_BUFFER_SIZE=1024

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
board_build.flash_mode = qio
