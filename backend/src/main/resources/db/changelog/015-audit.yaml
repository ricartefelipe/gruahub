databaseChangeLog:
  - changeSet:
      id: 015-001-audit-event
      author: gruahub
      changes:
        - createTable:
            tableName: audit_event
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
              - column:
                  name: actor_user_id
                  type: uuid
              - column:
                  name: actor_email
                  type: varchar(255)
              - column:
                  name: action
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: resource_type
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: resource_id
                  type: varchar(100)
              - column:
                  name: outcome
                  type: varchar(20)
                  defaultValue: SUCCESS
              - column:
                  name: correlation_id
                  type: varchar(100)
              - column:
                  name: ip_address
                  type: varchar(50)
              - column:
                  name: metadata
                  type: jsonb
                  defaultValue: '{}'
              - column:
                  name: occurred_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
        - createIndex:
            tableName: audit_event
            indexName: idx_audit_tenant_time
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: occurred_at
        - createIndex:
            tableName: audit_event
            indexName: idx_audit_resource
            columns:
              - column:
                  name: resource_type
              - column:
                  name: resource_id
