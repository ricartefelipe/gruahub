networks:
  gruahub:
    driver: bridge

volumes:
  postgres_data:
  postgres_backups:
  keycloak_data:
  emqx_data:
  emqx_log:
  minio_data:
  caddy_data:
  caddy_config:
  uptime_kuma_data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: gruahub-postgres
    restart: unless-stopped
    networks: [gruahub]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gruahub}
      POSTGRES_USER: ${POSTGRES_USER:-gruahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-keycloak-schema.sql:/docker-entrypoint-initdb.d/01-keycloak-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: gruahub-keycloak
    restart: unless-stopped
    networks: [gruahub]
    ports:
      - "8180:8080"
    command:
      - start-dev
      - --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-gruahub}
      KC_DB_USERNAME: ${POSTGRES_USER:-gruahub}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_DB_SCHEMA: keycloak
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HTTP_ENABLED: "true"
    volumes:
      - ./keycloak/realm-gruahub.json:/opt/keycloak/data/import/realm-gruahub.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && cat <&3 | grep -q '\"status\": \"UP\"'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  emqx:
    image: emqx/emqx:5.7.2
    container_name: gruahub-emqx
    restart: unless-stopped
    networks: [gruahub]
    ports:
      - "1883:1883"
      - "8883:8883"
      - "18083:18083"
    environment:
      EMQX_NAME: gruahub-emqx
      EMQX_LOG__CONSOLE__LEVEL: warning
      EMQX_AUTHENTICATION__1__MECHANISM: password_based
      EMQX_AUTHENTICATION__1__BACKEND: built_in_database
      EMQX_AUTHENTICATION__1__PASSWORD_HASH_ALGORITHM__NAME: sha256
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
    volumes:
      - emqx_data:/opt/emqx/data
      - emqx_log:/opt/emqx/log
      - ./emqx/acl.conf:/opt/emqx/etc/acl.conf:ro
      - ./emqx/docker-entrypoint-wrapper.sh:/docker-entrypoint-wrapper.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint-wrapper.sh"]
    command: ["/opt/emqx/bin/emqx", "foreground"]
    healthcheck:
      test: ["CMD", "sh", "-c", "/opt/emqx/bin/emqx ping && test -f /tmp/emqx-admin-synced"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  emqx-users:
    image: curlimages/curl:8.7.1
    container_name: gruahub-emqx-users
    networks: [gruahub]
    depends_on:
      emqx:
        condition: service_healthy
    environment:
      EMQX_API: http://emqx:18083
      EMQX_DASHBOARD_USERNAME: ${EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD_PASSWORD: ${EMQX_DASHBOARD_PASSWORD}
      MQTT_USERNAME: ${MQTT_USERNAME:-gruahub-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MQTT_SIM_USERNAME: ${MQTT_SIM_USERNAME:-sim-machine}
      MQTT_SIM_PASSWORD: ${MQTT_SIM_PASSWORD}
    volumes:
      - ./emqx/bootstrap-users.sh:/bootstrap-users.sh:ro
    entrypoint: ["/bin/sh", "/bootstrap-users.sh"]
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2024-05-10T01-41-38Z
    container_name: gruahub-minio
    restart: unless-stopped
    networks: [gruahub]
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-setup:
    image: minio/mc:RELEASE.2024-05-09T17-04-24Z
    container_name: gruahub-minio-setup
    networks: [gruahub]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-gruahub}
    entrypoint: >
      /bin/sh -c "
        mc alias set gruahub http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
        mc mb --ignore-existing gruahub/$${MINIO_BUCKET} &&
        mc anonymous set none gruahub/$${MINIO_BUCKET} &&
        echo 'MinIO bucket created'
      "
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/Dockerfile.backend
    container_name: gruahub-backend
    restart: unless-stopped
    networks: [gruahub]
    ports:
      - "8080:8080"
    environment:
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-gruahub}
      DB_USER: ${DB_USER:-gruahub}
      DB_PASSWORD: ${DB_PASSWORD}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-gruahub}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-gruahub-backend}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://emqx:1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-gruahub-backend}
      MQTT_PASSWORD: ${MQTT_PASSWORD}
      MINIO_HOST: ${MINIO_HOST:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET:-gruahub}
      GRUAHUB_SANDBOX_ENABLED: ${GRUAHUB_SANDBOX_ENABLED:-true}
      GRUAHUB_SANDBOX_WEBHOOK_SECRET: ${GRUAHUB_SANDBOX_WEBHOOK_SECRET}
      GRUAHUB_CORS_ORIGINS: ${GRUAHUB_CORS_ORIGINS:-http://localhost:3000,http://localhost:3001,https://localhost}
      GRUAHUB_RATE_LIMIT_WEBHOOK_MAX: ${GRUAHUB_RATE_LIMIT_WEBHOOK_MAX:-30}
      GRUAHUB_RATE_LIMIT_SANDBOX_MAX: ${GRUAHUB_RATE_LIMIT_SANDBOX_MAX:-60}
      GRUAHUB_RATE_LIMIT_WINDOW_SECONDS: ${GRUAHUB_RATE_LIMIT_WINDOW_SECONDS:-60}
      GRUAHUB_RATE_LIMIT_GLOBAL_ENABLED: ${GRUAHUB_RATE_LIMIT_GLOBAL_ENABLED:-true}
      GRUAHUB_RATE_LIMIT_GLOBAL_MAX: ${GRUAHUB_RATE_LIMIT_GLOBAL_MAX:-300}
      GRUAHUB_RATE_LIMIT_GLOBAL_WINDOW_SECONDS: ${GRUAHUB_RATE_LIMIT_GLOBAL_WINDOW_SECONDS:-60}
      GRUAHUB_PUSH_PROVIDER: ${GRUAHUB_PUSH_PROVIDER:-noop}
      GRUAHUB_PUSH_HTTP_STUB_URL: ${GRUAHUB_PUSH_HTTP_STUB_URL:-}
      LOG_JSON: ${LOG_JSON:-true}
      QUARKUS_LIQUIBASE_CONTEXTS: ${QUARKUS_LIQUIBASE_CONTEXTS:-demo}
      DB_PASSWORD_FILE: ${DB_PASSWORD_FILE:-}
      KEYCLOAK_CLIENT_SECRET_FILE: ${KEYCLOAK_CLIENT_SECRET_FILE:-}
      MQTT_PASSWORD_FILE: ${MQTT_PASSWORD_FILE:-}
      MINIO_SECRET_KEY_FILE: ${MINIO_SECRET_KEY_FILE:-}
      GRUAHUB_SANDBOX_WEBHOOK_SECRET_FILE: ${GRUAHUB_SANDBOX_WEBHOOK_SECRET_FILE:-}
    volumes:
      - ./scripts/load-secret-files.sh:/scripts/load-secret-files.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      emqx:
        condition: service_healthy
      emqx-users:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/q/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  web:
    build:
      context: ../web
      dockerfile: ../infra/Dockerfile.web
    container_name: gruahub-web
    restart: unless-stopped
    networks: [gruahub]
    ports:
      - "3000:3000"
    environment:
      HOSTNAME: "0.0.0.0"
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/gruahub}
      KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_ISSUER:-http://keycloak:8080/realms/gruahub}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID_WEB:-gruahub-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET_WEB}
      NEXTAUTH_SECRET_FILE: ${NEXTAUTH_SECRET_FILE:-}
      KEYCLOAK_CLIENT_SECRET_FILE: ${KEYCLOAK_CLIENT_SECRET_WEB_FILE:-}
    volumes:
      - ./scripts/load-secret-files.sh:/scripts/load-secret-files.sh:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:3000"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  machine-simulator:
    build:
      context: ../simulators/machine-simulator
    container_name: gruahub-machine-sim
    restart: unless-stopped
    networks: [gruahub]
    profiles: [simulators]
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:-tcp://emqx:1883}
      MQTT_USERNAME: ${MQTT_SIM_USERNAME:-sim-machine}
      MQTT_PASSWORD: ${MQTT_SIM_PASSWORD}
      TENANT_ID: ${TENANT_ID:-11111111-0000-0000-0000-000000000001}
      MACHINE_IDS: ${MACHINE_IDS:-66666666-0000-0000-0000-000000000001,66666666-0000-0000-0000-000000000003}
      HEARTBEAT_INTERVAL_MS: ${HEARTBEAT_INTERVAL_MS:-30000}
    depends_on:
      emqx:
        condition: service_healthy
      emqx-users:
        condition: service_completed_successfully
      backend:
        condition: service_healthy

  payment-simulator:
    build:
      context: ../simulators/payment-simulator
    container_name: gruahub-payment-sim
    restart: unless-stopped
    networks: [gruahub]
    profiles: [simulators]
    environment:
      BACKEND_URL: http://backend:8080
      SANDBOX_SECRET: ${SANDBOX_SECRET}
      TENANT_ID: ${TENANT_ID:-11111111-0000-0000-0000-000000000001}
      MACHINE_ID: ${MACHINE_ID:-66666666-0000-0000-0000-000000000001}
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    image: gruahub-caddy:2.8-ratelimit
    container_name: gruahub-caddy
    restart: unless-stopped
    networks: [gruahub]
    profiles: [tls, prod-like]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: gruahub-uptime-kuma
    restart: unless-stopped
    networks: [gruahub]
    profiles: [monitoring]
    ports:
      - "3002:3001"
    volumes:
      - uptime_kuma_data:/app/data
    depends_on:
      backend:
        condition: service_healthy

  postgres-backup:
    build:
      context: .
      dockerfile: Dockerfile.postgres-backup
    container_name: gruahub-postgres-backup
    restart: unless-stopped
    networks: [gruahub]
    profiles: [backup, prod-like]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-gruahub}
      POSTGRES_USER: ${POSTGRES_USER:-gruahub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD_FILE: ${POSTGRES_PASSWORD_FILE:-}
      BACKUP_DIR: /backups
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_S3_ACCESS_KEY_FILE: ${BACKUP_S3_ACCESS_KEY_FILE:-}
      BACKUP_S3_SECRET_KEY_FILE: ${BACKUP_S3_SECRET_KEY_FILE:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-${MINIO_BUCKET:-gruahub}}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-postgres-backups}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-gruahub}
    volumes:
      - postgres_backups:/backups
      - ./scripts/pg-backup.sh:/scripts/pg-backup.sh:ro
      - ./scripts/pg-backup-loop.sh:/scripts/pg-backup-loop.sh:ro
      - ./scripts/pg-restore-drill.sh:/scripts/pg-restore-drill.sh:ro
      - ./scripts/load-secret-files.sh:/scripts/load-secret-files.sh:ro
    entrypoint: ["/bin/sh"]
    command: ["/scripts/pg-backup-loop.sh"]
    depends_on:
      postgres:
        condition: service_healthy
