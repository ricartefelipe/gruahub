# ================================================================
# GruaHub — Quarkus Application Configuration
# ================================================================

# Application
quarkus.application.name=gruahub-backend
quarkus.application.version=1.0.0-SNAPSHOT

# HTTP
quarkus.http.port=8080
quarkus.http.cors=true
quarkus.http.cors.origins=${GRUAHUB_CORS_ORIGINS:http://localhost:3000,http://localhost:3001,https://localhost}
quarkus.http.cors.headers=accept,authorization,content-type,x-requested-with,idempotency-key,x-correlation-id,x-tenant-id,x-machine-id,x-signature,x-sandbox-secret
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.allow-x-forwarded=true
quarkus.http.proxy.enable-forwarded-host=true

# Security headers
quarkus.http.header."X-Frame-Options".value=DENY
quarkus.http.header."X-Content-Type-Options".value=nosniff
quarkus.http.header."X-XSS-Protection".value=1; mode=block
quarkus.http.header."Referrer-Policy".value=strict-origin-when-cross-origin

# ================================================================
# Database
# ================================================================
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${DB_USER:gruahub}
quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.jdbc.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:gruahub}

quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false
quarkus.hibernate-orm.physical-naming-strategy=org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy

# Liquibase
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml

# ================================================================
# Keycloak / OIDC
# ================================================================
quarkus.oidc.auth-server-url=${KEYCLOAK_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:gruahub}
quarkus.oidc.client-id=${KEYCLOAK_CLIENT_ID:gruahub-backend}
quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET}
# IMPORTANTE: tls.verification e token.issuer NUNCA como config global.
# Em produção o Keycloak usa TLS válido e o issuer é verificado.
# Overrides inseguros ficam SOMENTE no perfil %dev abaixo.

# ================================================================
# MQTT / EMQX
# ================================================================
gruahub.mqtt.broker-url=${MQTT_BROKER_URL:tcp://localhost:1883}
gruahub.mqtt.client-id-prefix=gruahub-backend
gruahub.mqtt.username=${MQTT_USERNAME:gruahub-backend}
gruahub.mqtt.password=${MQTT_PASSWORD}
gruahub.mqtt.heartbeat-timeout-seconds=${MQTT_HEARTBEAT_TIMEOUT_SECONDS:120}
gruahub.mqtt.command-ttl-seconds=${MQTT_COMMAND_TTL_SECONDS:300}

gruahub.sandbox.enabled=${GRUAHUB_SANDBOX_ENABLED:false}
%prod.gruahub.sandbox.secret=${GRUAHUB_SANDBOX_WEBHOOK_SECRET}

gruahub.rate-limit.webhook.max-requests=${GRUAHUB_RATE_LIMIT_WEBHOOK_MAX:30}
gruahub.rate-limit.sandbox.max-requests=${GRUAHUB_RATE_LIMIT_SANDBOX_MAX:60}
gruahub.rate-limit.window-seconds=${GRUAHUB_RATE_LIMIT_WINDOW_SECONDS:60}
gruahub.rate-limit.global.enabled=${GRUAHUB_RATE_LIMIT_GLOBAL_ENABLED:true}
gruahub.rate-limit.global.max-requests=${GRUAHUB_RATE_LIMIT_GLOBAL_MAX:300}
gruahub.rate-limit.global.window-seconds=${GRUAHUB_RATE_LIMIT_GLOBAL_WINDOW_SECONDS:60}

# Push: noop (log) ou http-stub (POST JSON). Não é FCM/Google completo.
gruahub.push.provider=${GRUAHUB_PUSH_PROVIDER:noop}
gruahub.push.http-stub.url=${GRUAHUB_PUSH_HTTP_STUB_URL:}

# ================================================================
# MinIO / S3
# ================================================================
quarkus.s3.endpoint-override=http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
quarkus.s3.aws.region=us-east-1
quarkus.s3.aws.credentials.type=static
quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY}
quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY}
gruahub.s3.bucket=${MINIO_BUCKET:gruahub}
gruahub.s3.presigned-url-expiry-minutes=60

# ================================================================
# OpenAPI / Swagger UI
# ================================================================
quarkus.smallrye-openapi.info-title=GruaHub API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Plataforma multitenant para gestão de máquinas de pelúcia
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui

# ================================================================
# Observability
# ================================================================
quarkus.otel.exporter.otlp.endpoint=${OTEL_ENDPOINT:http://localhost:4317}
quarkus.otel.enabled=${OTEL_ENABLED:false}

quarkus.log.console.format=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.console.json=${LOG_JSON:false}
quarkus.log.level=INFO
quarkus.log.category."com.gruahub".level=DEBUG

# ================================================================
# Health
# ================================================================
quarkus.health.extensions.enabled=true

# ================================================================
# Schedulers
# ================================================================
gruahub.scheduler.outbox-cron=*/1 * * * * ?
gruahub.scheduler.heartbeat-timeout-cron=*/30 * * * * ?
gruahub.scheduler.reconciliation-cron=0 */5 * * * ?
gruahub.scheduler.command-ttl-cron=*/10 * * * * ?

# ================================================================
# Dev Profile Overrides
# ================================================================
%dev.quarkus.hibernate-orm.log.sql=true
%dev.quarkus.log.level=DEBUG
%dev.quarkus.log.console.json=false
%dev.quarkus.oidc.tls.verification=none
%dev.quarkus.oidc.token.issuer=any
%dev.quarkus.devservices.enabled=false
%dev.gruahub.sandbox.enabled=true
%dev.quarkus.datasource.password=${DB_PASSWORD:gruahub}
%dev.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:gruahub-backend-secret}
%dev.gruahub.mqtt.password=${MQTT_PASSWORD:gruahub-backend-pass}
%dev.gruahub.sandbox.secret=${GRUAHUB_SANDBOX_WEBHOOK_SECRET:sandbox-webhook-secret-gruahub-demo}
%dev.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY:minioadmin}
%dev.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY:minioadmin}

# ================================================================
# Test Profile Overrides
# ================================================================
%test.quarkus.datasource.db-kind=postgresql
%test.quarkus.datasource.devservices.enabled=true
%test.quarkus.oidc.enabled=false
%test.quarkus.log.level=WARN
%test.quarkus.log.category."com.gruahub".level=INFO
%test.gruahub.scheduler.outbox-cron=*/1 * * * * ?
%test.gruahub.sandbox.enabled=true
%test.quarkus.datasource.password=${DB_PASSWORD:gruahub}
%test.quarkus.oidc.credentials.secret=${KEYCLOAK_CLIENT_SECRET:test-oidc-secret}
%test.gruahub.mqtt.password=${MQTT_PASSWORD:test-mqtt-pass}
%test.gruahub.sandbox.secret=${GRUAHUB_SANDBOX_WEBHOOK_SECRET:test-sandbox-secret}
%test.quarkus.s3.aws.credentials.static-provider.access-key-id=${MINIO_ACCESS_KEY:minioadmin}
%test.quarkus.s3.aws.credentials.static-provider.secret-access-key=${MINIO_SECRET_KEY:minioadmin}
