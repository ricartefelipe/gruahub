databaseChangeLog:
  - changeSet:
      id: 019-001-alert-open-machine-type-unique
      author: gruahub
      changes:
        - sql:
            sql: >
              CREATE UNIQUE INDEX IF NOT EXISTS uq_alert_open_machine_type
              ON alert (tenant_id, machine_id, alert_type)
              WHERE status = 'OPEN' AND machine_id IS NOT NULL;

  - changeSet:
      id: 019-002-seed-operating-point-priority
      author: gruahub
      context: demo
      changes:
        - sql:
            sql: >
              UPDATE operating_point
              SET priority_score = 90,
                  priority_explanation = '"Alta prioridade — shopping com volume diário"'::jsonb
              WHERE id = '33333333-0000-0000-0000-000000000001';
              UPDATE operating_point
              SET priority_score = 70,
                  priority_explanation = '"Prioridade média — supermercado"'::jsonb
              WHERE id = '33333333-0000-0000-0000-000000000002';

