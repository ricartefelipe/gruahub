%% GruaHub EMQX ACL - Demonstrativo local
%% Em producao: usar ACL dinamica com credenciais por dispositivo

%% Backend tem acesso total para assinar e publicar
{allow, {user, "gruahub-backend"}, subscribe, ["v1/#"]}.
{allow, {user, "gruahub-backend"}, publish, ["v1/#"]}.

%% Simuladores de maquina podem publicar em topicos de telemetria/status/eventos
%% e assinar topicos de comando
{allow, {user, "sim-machine"}, subscribe, ["v1/+/machines/+/commands"]}.
{allow, {user, "sim-machine"}, publish, ["v1/+/machines/+/telemetry"]}.
{allow, {user, "sim-machine"}, publish, ["v1/+/machines/+/events"]}.
{allow, {user, "sim-machine"}, publish, ["v1/+/machines/+/status"]}.
{allow, {user, "sim-machine"}, publish, ["v1/+/machines/+/command-acks"]}.

%% Negar tudo o mais por padrao
{deny, all}.
