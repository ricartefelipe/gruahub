name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  # ─────────────────────────────────────────────────────────────
  # Backend — Quarkus 3 + Java 21
  # ─────────────────────────────────────────────────────────────
  backend:
    name: Backend (Java 21 / Quarkus 3)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gruahub_test
          POSTGRES_USER: gruahub
          POSTGRES_PASSWORD: gruahub
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Wait for PostgreSQL
        run: |
          timeout 60 bash -c \
            'until pg_isready -h localhost -p 5432 -U gruahub; do sleep 2; done'

      - name: Run unit + integration tests
        working-directory: backend
        env:
          QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/gruahub_test
          QUARKUS_DATASOURCE_USERNAME: gruahub
          QUARKUS_DATASOURCE_PASSWORD: gruahub
          QUARKUS_PROFILE: test
        run: ./mvnw -B verify -Dquarkus.test.profile=test

      - name: Build production jar (no tests)
        working-directory: backend
        run: ./mvnw -B package -DskipTests

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-quarkus-app
          path: backend/target/quarkus-app/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────
  # Frontend Web — Next.js 14
  # ─────────────────────────────────────────────────────────────
  web:
    name: Web (Next.js 14)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Unit tests
        working-directory: web
        run: npm test -- --passWithNoTests --ci

      - name: Production build
        working-directory: web
        env:
          NEXTAUTH_SECRET: ci-secret-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://localhost:8080
          KEYCLOAK_ID: gruahub-web
          KEYCLOAK_SECRET: ci-placeholder
          KEYCLOAK_ISSUER: http://localhost:8180/realms/gruahub
        run: npm run build

      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-nextjs-build
          path: web/.next/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────
  # Mobile — Expo 51 / React Native
  # ─────────────────────────────────────────────────────────────
  mobile:
    name: Mobile (Expo 51)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Type check
        working-directory: mobile
        run: npx tsc --noEmit

      - name: Run unit tests (17 offline-queue tests)
        working-directory: mobile
        run: npm test -- --ci --forceExit --testPathPattern="offlineQueue"

      - name: Export (static bundle check)
        working-directory: mobile
        env:
          EXPO_PUBLIC_API_URL: http://localhost:8080
          EXPO_PUBLIC_KEYCLOAK_URL: http://localhost:8180
          EXPO_PUBLIC_KEYCLOAK_REALM: gruahub
          EXPO_PUBLIC_KEYCLOAK_CLIENT_ID: gruahub-mobile
        run: npx expo export --platform web --output-dir /tmp/expo-export 2>&1 | tail -5 || true

  # ─────────────────────────────────────────────────────────────
  # Simulators — TypeScript build + type check
  # ─────────────────────────────────────────────────────────────
  simulators:
    name: Simulators (TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build machine simulator
        working-directory: simulators/machine-simulator
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

      - name: Build payment simulator
        working-directory: simulators/payment-simulator
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  # ─────────────────────────────────────────────────────────────
  # Contracts — MQTT JSON Schema + OpenAPI
  # ─────────────────────────────────────────────────────────────
  contracts:
    name: Contracts (MQTT + OpenAPI)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install validators
        run: npm install -g ajv-cli@5 ajv-formats @redocly/cli@1

      - name: Compile MQTT schema
        run: |
          ajv compile \
            --spec=draft7 \
            -c ajv-formats \
            -s contracts/mqtt/schema-v1.json

      - name: Validate MQTT examples
        run: |
          shopt -s nullglob
          examples=(contracts/mqtt/examples/*.json)
          if [ ${#examples[@]} -eq 0 ]; then
            echo "No MQTT examples found" >&2
            exit 1
          fi
          for f in "${examples[@]}"; do
            ajv validate \
              --spec=draft7 \
              -c ajv-formats \
              -s contracts/mqtt/schema-v1.json \
              -d "$f"
          done

      - name: Validate OpenAPI
        run: |
          test -f contracts/openapi/openapi.yaml
          test -f contracts/openapi/openapi.json
          redocly lint contracts/openapi/openapi.yaml --extends=minimal

  # ─────────────────────────────────────────────────────────────
  # Security — Static analysis (OWASP + npm audit)
  # ─────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: OWASP Dependency Check (backend)
        working-directory: backend
        run: |
          ./mvnw -B org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=9 \
            -DassemblyAnalyzerEnabled=false \
            -DnodeAnalyzerEnabled=false \
            -DnexusAnalyzerEnabled=false \
            -Dformats=JSON || true

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: npm audit web
        working-directory: web
        run: npm audit --audit-level=critical || true

      - name: npm audit mobile
        working-directory: mobile
        run: npm audit --audit-level=critical || true

  # ─────────────────────────────────────────────────────────────
  # Docker Compose smoke (infra mínima: postgres, keycloak, emqx, minio)
  # Roda em push/PR para main|master|develop. Sem profile simulators.
  # ─────────────────────────────────────────────────────────────
  docker-compose:
    name: Docker Compose (infrastructure smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    if: >
      (github.event_name == 'push' &&
        (github.ref == 'refs/heads/main' ||
         github.ref == 'refs/heads/master' ||
         github.ref == 'refs/heads/develop')) ||
      (github.event_name == 'pull_request' &&
        (github.base_ref == 'main' ||
         github.base_ref == 'master' ||
         github.base_ref == 'develop'))

    steps:
      - uses: actions/checkout@v4

      - name: Prepare env from example
        working-directory: infra
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi

      - name: Validate compose config
        working-directory: infra
        run: docker compose config --quiet

      - name: Start infrastructure services
        working-directory: infra
        run: docker compose up -d postgres keycloak emqx minio

      - name: Wait for PostgreSQL ready
        run: |
          timeout 90 bash -c \
            'until docker compose -f infra/docker-compose.yml exec -T postgres \
               pg_isready -U gruahub; do sleep 3; done'

      - name: Wait for MinIO ready
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:9000/minio/health/live; do sleep 3; done'

      - name: Wait for EMQX ready
        run: |
          timeout 60 bash -c \
            'until curl -sf http://localhost:18083/api/v5/status 2>/dev/null | grep -q running; \
               do sleep 3; done' || \
          echo "EMQX health endpoint not ready (non-fatal for smoke test)"

      - name: Verify PostgreSQL connectivity
        run: |
          docker compose -f infra/docker-compose.yml exec -T postgres \
            psql -U gruahub -d gruahub -c "SELECT version();"

      - name: Teardown
        if: always()
        working-directory: infra
        run: docker compose down -v --remove-orphans
