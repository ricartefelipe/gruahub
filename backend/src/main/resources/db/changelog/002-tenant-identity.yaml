databaseChangeLog:
  - changeSet:
      id: 002-001-tenant
      author: gruahub
      comment: Tabela de tenant (empresa operadora)
      changes:
        - createTable:
            tableName: tenant
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: name
                  type: varchar(200)
                  constraints:
                    nullable: false
              - column:
                  name: slug
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: document_number
                  type: varchar(20)
              - column:
                  name: email
                  type: varchar(255)
              - column:
                  name: phone
                  type: varchar(20)
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: settings
                  type: jsonb
                  defaultValue: '{}'
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addUniqueConstraint:
            tableName: tenant
            constraintName: uq_tenant_slug
            columnNames: slug

  - changeSet:
      id: 002-002-external-user
      author: gruahub
      comment: Usuário externo (referência ao Keycloak)
      changes:
        - createTable:
            tableName: external_user
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: keycloak_id
                  type: varchar(100)
                  constraints:
                    nullable: false
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: email
                  type: varchar(255)
                  constraints:
                    nullable: false
              - column:
                  name: full_name
                  type: varchar(255)
              - column:
                  name: role
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  defaultValue: ACTIVE
                  constraints:
                    nullable: false
              - column:
                  name: phone
                  type: varchar(20)
              - column:
                  name: created_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: updated_at
                  type: timestamptz
                  defaultValueComputed: NOW()
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false
        - addForeignKeyConstraint:
            baseTableName: external_user
            baseColumnNames: tenant_id
            constraintName: fk_external_user_tenant
            referencedTableName: tenant
            referencedColumnNames: id
        - addUniqueConstraint:
            tableName: external_user
            constraintName: uq_user_keycloak_tenant
            columnNames: keycloak_id, tenant_id
        - createIndex:
            tableName: external_user
            indexName: idx_external_user_tenant
            columns:
              - column:
                  name: tenant_id
