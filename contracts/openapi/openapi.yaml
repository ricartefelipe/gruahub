components:
  schemas:
    AcknowledgeRequest:
      type: object
      properties:
        note:
          type: string
    AlertResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        machineId:
          $ref: "#/components/schemas/UUID"
        machineAssetNumber:
          type: string
        alertType:
          type: string
        severity:
          type: string
        status:
          type: string
        message:
          type: string
        occurredAt:
          $ref: "#/components/schemas/Instant"
        acknowledgedAt:
          $ref: "#/components/schemas/Instant"
        acknowledgedBy:
          type: string
    AuditEventResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        tenantId:
          $ref: "#/components/schemas/UUID"
        actorUserId:
          type: string
        actorEmail:
          type: string
        action:
          type: string
        resourceType:
          type: string
        resourceId:
          type: string
        metadata:
          type: string
        correlationId:
          type: string
        ipAddress:
          type: string
        occurredAt:
          $ref: "#/components/schemas/Instant"
    CampaignRequest:
      required:
      - name
      - status
      - startsAt
      - ruleType
      type: object
      properties:
        name:
          maxLength: 160
          pattern: \S
          type: string
        status:
          pattern: \S
          type: string
        startsAt:
          $ref: "#/components/schemas/Instant"
        endsAt:
          $ref: "#/components/schemas/Instant"
        machineId:
          $ref: "#/components/schemas/UUID"
        ruleType:
          pattern: \S
          type: string
        extraBonusPlays:
          format: int32
          minimum: 0
          type: integer
        buyN:
          format: int32
          minimum: 1
          type: integer
        getM:
          format: int32
          minimum: 1
          type: integer
    CampaignResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        name:
          type: string
        status:
          type: string
        startsAt:
          $ref: "#/components/schemas/Instant"
        endsAt:
          $ref: "#/components/schemas/Instant"
        machineId:
          $ref: "#/components/schemas/UUID"
        ruleType:
          type: string
        extraBonusPlays:
          format: int32
          type: integer
        buyN:
          format: int32
          type: integer
        getM:
          format: int32
          type: integer
        createdAt:
          $ref: "#/components/schemas/Instant"
        updatedAt:
          $ref: "#/components/schemas/Instant"
    CashCollectionRequest:
      required:
      - clientOperationId
      - visitId
      - machineId
      type: object
      properties:
        clientOperationId:
          $ref: "#/components/schemas/UUID"
        visitId:
          $ref: "#/components/schemas/UUID"
        machineId:
          $ref: "#/components/schemas/UUID"
        amountCents:
          format: int64
          minimum: 1
          type: integer
        notes:
          type: string
    ChecklistItem:
      type: object
      properties:
        key:
          type: string
        checked:
          type: boolean
    ChecklistRequest:
      required:
      - visitId
      - clientOperationId
      type: object
      properties:
        visitId:
          $ref: "#/components/schemas/UUID"
        clientOperationId:
          $ref: "#/components/schemas/UUID"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        completedAt:
          type: string
    CommissionPolicyRequest:
      required:
      - operatingPointId
      - policyType
      - effectiveFrom
      type: object
      properties:
        operatingPointId:
          $ref: "#/components/schemas/UUID"
        policyType:
          pattern: \S
          type: string
        percentage:
          type: number
        fixedAmountCents:
          format: int64
          type: integer
        effectiveFrom:
          pattern: \S
          type: string
        effectiveTo:
          type: string
    CommissionPolicyResponse:
      type: object
      properties:
        id:
          $ref: "#/components/schemas/UUID"
        operatingPointId:
          $ref: "#/components/schemas/UUID"
        operatingPointName:
          type: string
        policyType:
          type: string
        percentage:
          type: number
        fixedAmountCents:
          format: int64
          type: integer
        effectiveFrom:
          type: string
        effectiveTo:
          type: string
        versionNumber:
          format: int32
          type: integer
    CompleteVisitRequest:
      required:
      - visitId
      - clientOperationId
      type: object
      properties:
        visitId:
          $ref: "#/components/schemas/UUID"
        clientOperationId:
          $ref: "#/components/schemas/UUID"
        checkoutAt:
          type: string
        cashCollectedCents:
          format: int64
          type: integer
    CreateMachineRequest:
      required:
      - assetNumber
      - name
      - playPriceCents
      type: object
      properties:
        assetNumber:
          pattern: \S
          type: string
        name:
          pattern: \S
          type: string
        playPriceCents:
          format: int64
          minimum: 1
          type: integer
        currency:
          type: string
        qrCode:
          type: string
        machineModelId:
          $ref: "#/components/schemas/UUID"
        operatingPointId:
          $ref: "#/components/schemas/UUID"
        controllerId:
          $ref: "#/components/schemas/UUID"
        bonusPlays:
          format: int32
          type: integer
        prizeCapacity:
          format: int32
          type: integer
        notes:
          type: string
    CreateTicketRequest:
      required:
      - clientOperationId
      - machineId
      - title
      - priority
      type: object
      properties:
        clientOperationId:
          $ref: "#/components/schemas/UUID"
        machineId:
          $ref: "#/components/schemas/UUID"
        title:
          maxLength: 200
          pattern: \S
          type: string
        description:
          maxLength: 2000
          type: string
